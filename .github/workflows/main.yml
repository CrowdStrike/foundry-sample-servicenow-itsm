name: Sample CI
on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      
      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c  # v6.1.0
        with:
          go-version: '1.25.x'
          cache: true
          
      - name: Install Go dependencies
        run: go mod tidy
        working-directory: ./functions/itsmhelper
        
      - name: Build Go functions
        run: go build
        working-directory: ./functions/itsmhelper
        
      - name: Test Go functions
        run: go test ./...
        working-directory: ./functions/itsmhelper

  test-python:
    name: Test Python function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'functions/itsmhelper/requirements.txt'
      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest
        working-directory: functions/itsmhelper
      - name: Run tests
        run: pytest test_main.py
        working-directory: functions/itsmhelper
      - name: Verify function starts
        run: |
          timeout 30s bash -c '
            python main.py > output.log 2>&1 &
            PID=$!
            while ! grep -q "running at port 8081" output.log 2>/dev/null; do
              sleep 1
            done
            echo "✅ Application started successfully"
            kill $PID 2>/dev/null || true
          ' || {
            echo "❌ Application failed to start"
            cat output.log 2>/dev/null || echo "No output log found"
            exit 1
          }
        working-directory: functions/itsmhelper
